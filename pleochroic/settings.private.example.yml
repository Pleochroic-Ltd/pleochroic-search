# Example private overlay: copy to /etc/pleochroic-search/settings.private.yml and fill in the proxy.

outgoing:
  proxies:
    # The residential proxy every engine request goes through, one or more URLs per scheme
    #   socks5h://USER:PASS@HOST:PORT    (socks5h resolves DNS on the proxy side)
    #   https://USER:PASS@HOST:PORT      (an HTTPS CONNECT endpoint)
    all://:
      - "socks5h://USER:PASS@HOST:PORT"

# server.secret_key goes in /etc/pleochroic-search/secrets.env as SEARXNG_SECRET.
