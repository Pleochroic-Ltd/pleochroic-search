use_default_settings:
  engines:
    keep_only:
      # general web
      - google
      - bing
      - duckduckgo
      - brave
      - mojeek
      - startpage
      # code & Q&A
      - github
      - stackoverflow
      - askubuntu
      - superuser
      # reference / docs
      - wikipedia
      - mdn
      - mankier
      - arch linux wiki
      # research
      - arxiv
      # package registries
      - pypi
      - npm
      - crates.io
      - docker hub

general:
  instance_name: "Pleochroic Search"

search:
  # json for standalone-service, html for debugging over a tunnel
  formats:
    - html
    - json
  safe_search: 1

server:
  port: 8888
  bind_address: "127.0.0.1"
  limiter: false
  public_instance: false
  # Placeholder, overridden by SEARXNG_SECRET
  secret_key: "changeme-overridden-by-SEARXNG_SECRET-env-var"

# `proxies` comes from the private overlay
outgoing:
  request_timeout: 6.0
  max_request_timeout: 15.0
  pool_connections: 100
  enable_http2: true
  retries: 2
  extra_proxy_timeout: 10

engines:
  # general web
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: mojeek
    inactive: false
    weight: 0.5
  - name: startpage
    inactive: false
    weight: 0.5

  # package registries
  - name: npm
    disabled: false
  - name: crates.io
    disabled: false
